repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.17.3
  hooks:
    - id: ruff-check
      files: ^custom_components/
    - id: ruff-format
      files: ^custom_components/
- repo: https://github.com/pre-commit/mirrors-mypy
  rev: v2.4.1
  hooks:
    - id: mypy
      files: ^custom_components/
      # Keep in sync with requirements*.txt so the hook sees HA's types.
      additional_dependencies:
        - homeassistant==2026.10.4
        - homeassistant-stubs==2026.10.0
        - voluptuous-stubs==0.1.1
